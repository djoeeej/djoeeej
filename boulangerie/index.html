<style>
:root {
  --nuit: #131b31;
  --nuit-2: #1a2442;
  --nuit-3: #24335c;
  --vitre: #3a4f80;
  --farine: #f2ede3;
  --farine-2: #b9c0d3;
  --dorure: #e9a440;
  --dorure-2: #f5c57e;
  --papier: #f5f0e6;
  --encre: #1b2440;
  --encre-2: #525b75;
  --croute: #8a4520;
  --filet: rgba(27, 36, 64, 0.14);
  --filet-nuit: rgba(242, 237, 227, 0.14);

  --display: 'Gloock', 'Iowan Old Style', 'Times New Roman', serif;
  --text: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ipa: 'Charis SIL', 'Gentium Plus', 'Noto Sans', 'Segoe UI', system-ui, sans-serif;

  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.3125rem;
  --step-2: 1.5rem;
  --step-3: 2.25rem;
  --step-4: 3rem;
  --step-5: clamp(2.75rem, 6vw, 4.5rem);

  --gutter: clamp(16px, 4vw, 56px);
  --maxw: 1240px;
  --nav-h: 64px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: var(--nav-h); }
body {
  margin: 0;
  background: linear-gradient(180deg, #1c2847 0%, var(--nuit) 34rem, #10172b 100%) var(--nuit);
  color: var(--farine);
  font-family: var(--text);
  font-size: var(--step-0);
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img, svg, canvas { display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; }
p { margin: 0; }

:focus-visible { outline: 3px solid var(--dorure); outline-offset: 3px; border-radius: 4px; }

.skip {
  position: absolute; left: 16px; top: -100px; z-index: 100;
  background: var(--dorure); color: var(--nuit); padding: 0.6rem 1rem; border-radius: 999px; font-weight: 600; text-decoration: none;
}
.skip:focus { top: 12px; }

.wrap { width: min(100% - 2 * var(--gutter), var(--maxw)); margin-inline: auto; }

/* ───────── Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 48px; padding: 0.75rem 1.4rem; border-radius: 999px;
  font-weight: 600; font-size: 1rem; text-decoration: none; cursor: pointer;
  border: 1px solid transparent; transition: background-color 0.2s, border-color 0.2s, color 0.2s;
}
.btn-primary { background: var(--dorure); color: var(--nuit); }
.btn-primary:hover { background: var(--dorure-2); }
.btn-ghost { border-color: rgba(242, 237, 227, 0.35); background: transparent; }
.btn-ghost:hover { border-color: var(--farine); }
.btn-small { min-height: 40px; padding: 0.5rem 1rem; font-size: 0.9375rem; }

/* ───────── Navigation */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: var(--nav-h);
  display: flex; align-items: center; gap: 1.5rem; padding-inline: var(--gutter);
  transition: background-color 0.3s, box-shadow 0.3s;
}
.nav.is-solid { background: rgba(19, 27, 49, 0.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--filet-nuit); }
.nav-mark { font-family: var(--display); font-size: 1.75rem; line-height: 1; text-decoration: none; margin-right: auto; }
.nav-links { display: flex; gap: 1.5rem; }
.nav-links a { text-decoration: none; color: var(--farine-2); font-size: 0.9375rem; padding: 0.5rem 0; }
.nav-links a:hover { color: var(--farine); }
.lang {
  min-width: 48px; min-height: 36px; padding: 0.25rem 0.75rem; border-radius: 999px; cursor: pointer;
  background: transparent; border: 1px solid rgba(242, 237, 227, 0.35); font-size: 0.875rem; font-weight: 600; letter-spacing: 0.04em;
}
.lang:hover { border-color: var(--farine); }

/* ───────── Hero */
.hero {
  position: relative;
  min-height: min(100svh, 940px);
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: center; gap: clamp(16px, 3vw, 48px);
  padding: calc(var(--nav-h) + 24px) var(--gutter) 48px;
  max-width: calc(var(--maxw) + 2 * var(--gutter)); margin-inline: auto;
}
.hero::before {
  content: ''; position: absolute; inset: 0 -20vw; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 42% 46% at 66% 52%, rgba(233, 164, 64, 0.2), rgba(233, 164, 64, 0) 70%);
}
.lockup { display: flex; flex-direction: column; font-family: var(--display); }
.lockup-small { font-size: clamp(1.5rem, 2.6vw, 2.25rem); color: var(--farine-2); line-height: 1.1; }
.lockup-big { font-size: clamp(6.5rem, 17vw, 14rem); line-height: 0.82; letter-spacing: -0.02em; margin-left: -0.06em; margin-top: 0.08em; }
.hero-tagline { margin-top: 1.75rem; font-size: var(--step-1); line-height: 1.4; max-width: 24ch; }
.hero-where { margin-top: 0.75rem; color: var(--farine-2); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
.hero-stage { position: relative; min-width: 0; }
.hero-view { position: relative; width: 100%; aspect-ratio: 6 / 5; max-height: 70vh; margin-inline: auto; }
.carousel-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: grab;
  -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%), linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to bottom, #000 72%, transparent 100%), linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
  mask-composite: intersect;
}
.carousel-canvas.is-dragging { cursor: grabbing; }
.hero-fallback { display: block; width: min(70%, 420px); aspect-ratio: 4 / 5; object-fit: cover; margin: 4% auto 0; border-radius: 18px; box-shadow: 0 40px 60px -30px rgba(0, 0, 0, 0.8); }
.hero-caption { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.75rem 1rem; margin-top: 0.5rem; }
.hero-label { min-width: 16ch; text-align: center; }
.hero-now { display: block; color: var(--farine-2); font-size: var(--step--1); }
.hero-name { display: block; font-family: var(--display); font-size: var(--step-2); line-height: 1.15; }
.hero-hint { margin-top: 0.75rem; text-align: center; color: var(--farine-2); font-size: var(--step--1); }

/* ───────── Shared section heads */
.section { padding-block: clamp(4.5rem, 10vw, 8rem); }
.section-head h2 { font-family: var(--display); font-size: var(--step-5); line-height: 1; }
.section-head p { margin-top: 1rem; color: var(--farine-2); font-size: var(--step-1); line-height: 1.45; max-width: 46ch; }

/* ───────── La vitrine */
.shelf { margin-top: clamp(3rem, 6vw, 5rem); }
.shelf-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1.25rem; margin-bottom: 0.25rem; }
.shelf-head h3 { font-family: var(--display); font-size: var(--step-3); line-height: 1.1; }
.shelf-head p { color: var(--farine-2); max-width: 52ch; }
.shelf-row {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 42%), 1fr));
  gap: 2.25rem clamp(14px, 2vw, 28px); margin-top: 1.25rem;
}
.item {
  appearance: none; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer;
  display: flex; flex-direction: column; min-width: 0; border-radius: 14px; perspective: 900px;
}

/* Photos that tilt towards the pointer, with a moving highlight */
.item-photo, .photo-card {
  position: relative; display: block; overflow: hidden; aspect-ratio: 4 / 5; background: var(--nuit-2);
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.6s;
  will-change: transform;
}
.item-photo { border-radius: 14px; box-shadow: 0 26px 40px -26px rgba(0, 0, 0, 0.85); }
.item-photo img, .photo-card img {
  display: block; width: 100%; height: 100%; object-fit: cover;
  transform: translate(calc(var(--mx, 0) * -8px), calc(var(--my, 0) * -8px)) scale(1.07);
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.is-tilting { transition-duration: 0.12s; }
.is-tilting img { transition-duration: 0.12s; }
.item-photo.is-tilting { box-shadow: 0 36px 50px -26px rgba(0, 0, 0, 0.9); }
.glare {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255, 244, 225, 0.32), rgba(255, 244, 225, 0) 55%);
}
.is-tilting .glare { opacity: 1; }
.is-empty { display: grid; place-items: center; background: radial-gradient(ellipse at 50% 65%, #b8692a, #5a2a10 60%, #24170f); }
.item-photo img { position: absolute; inset: 0; opacity: 1; transition: opacity 0.5s, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
.item-photo.is-empty img { opacity: 0; }
.item-photo:not(.is-empty) .empty-name { display: none; }
.empty-name { font-family: var(--display); font-size: 1.6rem; line-height: 1.1; text-align: center; color: var(--farine); padding: 1.25rem; }

.tag {
  position: relative; z-index: 1;
  display: block; margin: -1.75rem 0.75rem 0; padding: 0.7rem 0.9rem 0.8rem;
  background: var(--papier); color: var(--encre); border-radius: 4px;
  box-shadow: 0 10px 24px -14px rgba(0, 0, 0, 0.7);
}
.tag-name { display: block; font-family: var(--display); font-size: 1.25rem; line-height: 1.15; }
.tag-short { display: block; margin-top: 0.25rem; font-size: var(--step--1); line-height: 1.4; color: var(--encre-2); }
.item:hover .tag-name, .item:focus-visible .tag-name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }

/* ───────── Visit */
.visit-title { font-family: var(--display); font-size: var(--step-5); line-height: 1; }
.visite-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(2rem, 6vw, 6rem); align-items: start; }
.address { margin-top: 2rem; font-family: var(--display); font-size: var(--step-3); line-height: 1.15; font-style: normal; }
.visite-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
.hours { width: 100%; border-collapse: collapse; }
.hours caption { text-align: left; font-family: var(--display); font-size: var(--step-2); padding-bottom: 0.75rem; }
.hours th, .hours td { padding: 0.8rem 0; border-top: 1px solid var(--filet-nuit); text-align: left; font-weight: 400; }
.hours td { text-align: right; }
.hours tr.today th, .hours tr.today td { color: var(--dorure); font-weight: 600; }
.phone-line { display: flex; justify-content: space-between; padding: 0.8rem 0; border-top: 1px solid var(--filet-nuit); border-bottom: 1px solid var(--filet-nuit); margin-top: 1.5rem; }
.todo { color: var(--farine-2); font-style: italic; border-bottom: 1px dashed currentColor; }

/* ───────── Footer */
.footer { border-top: 1px solid var(--filet-nuit); padding-block: 2.5rem 3rem; color: var(--farine-2); font-size: var(--step--1); }
.footer .wrap { display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; align-items: baseline; justify-content: space-between; }
.footer-mark { font-family: var(--display); font-size: 1.5rem; color: var(--farine); }
.credits { flex-basis: 100%; }
.credits summary { cursor: pointer; display: inline-block; padding: 0.25rem 0; }
.credits p { margin-top: 0.5rem; }
.credits ul { margin: 0.5rem 0 0; padding-left: 1.1rem; columns: 2 20rem; }
.credits li { margin-bottom: 0.25rem; break-inside: avoid; }
.noscript { padding: 2rem; }

/* ───────── Product page (dialog) */
.detail {
  position: fixed; inset: 0; z-index: 50;
  display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(400px, 1fr);
  background: var(--nuit);
}
.detail[hidden] { display: none; }
.detail-stage {
  position: relative; overflow: hidden; min-height: 0;
  display: flex; align-items: center; justify-content: center; perspective: 1300px;
  background:
    radial-gradient(ellipse 60% 50% at 50% 62%, rgba(233, 164, 64, 0.24), rgba(233, 164, 64, 0) 70%),
    linear-gradient(180deg, #1f2c50 0%, #121a30 100%);
}
.photo-scene { width: min(68%, 54vh, 540px); margin-top: -4vh; }
.photo-card {
  margin: 0; border-radius: 22px; touch-action: none;
  box-shadow: 0 60px 90px -45px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.06);
  -webkit-box-reflect: below 14px linear-gradient(transparent 74%, rgba(255, 255, 255, 0.16));
}
.photo-card .empty-name { display: none; }
.photo-card.is-empty .empty-name { display: grid; place-items: center; position: absolute; inset: 0; font-size: 2.4rem; padding: 2rem; }
.photo-credit { position: absolute; left: 24px; bottom: 30px; right: 140px; font-size: 0.8125rem; color: var(--farine-2); }
.photo-credit a { color: inherit; }
.stage-nav { position: absolute; right: 24px; bottom: 24px; display: flex; gap: 0.5rem; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: rgba(19, 27, 49, 0.6); border: 1px solid rgba(242, 237, 227, 0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.icon-btn:hover { border-color: var(--farine); }
.icon-btn svg { width: 20px; height: 20px; }
.detail-close {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  background: var(--papier); color: var(--encre); border-color: var(--filet);
  box-shadow: 0 6px 18px -8px rgba(0, 0, 0, 0.5);
}
.detail-close:hover { border-color: var(--encre); }

.detail-paper {
  overflow-y: auto; overscroll-behavior: contain; min-height: 0;
  background: var(--papier); color: var(--encre);
  padding: clamp(28px, 4vw, 56px) clamp(20px, 4vw, 56px) 64px;
}
.detail-paper:focus { outline: none; }
.detail-paper :focus-visible { outline-color: var(--croute); }
.paper-inner { max-width: 640px; }
.paper-cat { color: var(--croute); font-weight: 600; font-size: var(--step--1); }
.paper-head h2 { font-family: var(--display); font-size: clamp(2.5rem, 4.2vw, 3.5rem); line-height: 1.02; margin-top: 0.5rem; padding-right: 48px; }
.paper-ipa { margin-top: 0.6rem; font-family: var(--ipa); color: var(--encre-2); }
.paper-sub { margin-top: 0.25rem; color: var(--encre-2); font-style: italic; }
.paper-block { margin-top: 2rem; }
.paper-block h3, .ing-head h3, .method h3 { font-weight: 600; font-size: 1rem; color: var(--croute); }
.paper-block p { margin-top: 0.5rem; line-height: 1.68; max-width: 62ch; }
.paper-lede { font-size: var(--step-1); line-height: 1.5 !important; }

.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 2.25rem 0 0; border-top: 1px solid var(--filet); border-bottom: 1px solid var(--filet); }
.facts div { padding: 0.9rem 0.75rem 1rem 0; }
.facts div + div { padding-left: 0.9rem; border-left: 1px solid var(--filet); }
.facts dt { font-size: 0.8125rem; color: var(--encre-2); }
.facts dd { margin: 0.2rem 0 0; font-size: 1.125rem; font-weight: 600; line-height: 1.25; }
.allergens { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 1rem; font-size: var(--step--1); }
.allergens > span:first-child { color: var(--encre-2); margin-right: 0.25rem; }
.chip { border: 1px solid var(--filet); border-radius: 999px; padding: 0.15rem 0.6rem; background: rgba(255, 255, 255, 0.5); }

.ingredients { margin-top: 2.75rem; }
.ing-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1.5rem; }
.scaler { display: inline-flex; align-items: center; gap: 0.5rem; }
.scaler button {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--filet); background: #fff; color: var(--encre);
  font-size: 1.25rem; line-height: 1; cursor: pointer; display: grid; place-items: center;
}
.scaler button:hover:not(:disabled) { border-color: var(--encre); }
.scaler button:disabled { opacity: 0.35; cursor: default; }
.scaler output { min-width: 11ch; text-align: center; font-weight: 600; }
.scale-note { margin-top: 0.75rem; font-size: var(--step--1); color: var(--encre-2); background: rgba(233, 164, 64, 0.14); padding: 0.6rem 0.8rem; border-radius: 6px; }
.component { margin-top: 1.5rem; }
.component h4 { font-family: var(--display); font-size: 1.3rem; }
.component ul { list-style: none; padding: 0; margin: 0.5rem 0 0; }
.component li { border-bottom: 1px solid var(--filet); }
.component label { display: grid; grid-template-columns: 1.4rem 5.25rem minmax(0, 1fr); gap: 0 0.5rem; align-items: baseline; padding: 0.55rem 0; cursor: pointer; }
.component input { margin: 0; accent-color: var(--croute); width: 1rem; height: 1rem; transform: translateY(2px); }
.qty { font-weight: 600; white-space: nowrap; }
.ing-note { display: block; font-size: var(--step--1); color: var(--encre-2); }
.component input:checked ~ .qty, .component input:checked ~ .ing-name { text-decoration: line-through; color: var(--encre-2); }
.component-note { margin-top: 0.6rem; font-size: var(--step--1); color: var(--encre-2); }

.method { margin-top: 2.75rem; }
.method ol { list-style: none; counter-reset: step; padding: 0; margin: 0.75rem 0 0; }
.method li { counter-increment: step; display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); gap: 0.25rem; padding: 0.9rem 0; border-top: 1px solid var(--filet); line-height: 1.65; }
.method li::before { content: counter(step); font-family: var(--display); font-size: 1.5rem; line-height: 1.1; color: var(--croute); }
.tip { margin-top: 2.25rem; padding: 1.25rem 1.4rem; background: var(--encre); color: var(--papier); border-radius: 10px; }
.tip h3 { font-family: var(--display); font-size: 1.35rem; color: var(--dorure-2); }
.tip p { margin-top: 0.4rem; line-height: 1.6; }
.recipe-note { margin-top: 1.5rem; font-size: var(--step--1); color: var(--encre-2); max-width: 60ch; }
.paper-actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
.btn-ink { border-color: var(--encre); color: var(--encre); background: transparent; }
.btn-ink:hover { background: var(--encre); color: var(--papier); }

/* ───────── Responsive */
@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; text-align: left; padding-top: calc(var(--nav-h) + 8px); min-height: 0; }
  .hero-stage { order: -1; }
  .hero-view { aspect-ratio: 1 / 1; max-height: 58vh; width: min(100%, 64vh); }
  .visite-grid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .detail { display: block; overflow-y: auto; overscroll-behavior: contain; }
  .detail-stage { position: sticky; top: 0; height: 50svh; }
  .detail-paper { position: relative; z-index: 1; overflow: visible; margin-top: -20px; border-radius: 20px 20px 0 0; min-height: 50svh; box-shadow: 0 -12px 30px -18px rgba(0, 0, 0, 0.6); }
  .photo-scene { width: min(62%, 34svh); margin-top: 0; }
  .photo-credit { left: 16px; bottom: 34px; right: 128px; font-size: 0.75rem; }
  .stage-nav { right: 16px; bottom: 30px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts div:nth-child(3) { padding-left: 0; border-left: 0; border-top: 1px solid var(--filet); }
  .facts div:nth-child(4) { border-top: 1px solid var(--filet); }
}
@media (max-width: 560px) {
  .nav-links { display: none; }
  .tag { margin-inline: 0.4rem; padding: 0.55rem 0.65rem 0.65rem; }
  .tag-name { font-size: 1.05rem; }
  .tag-short { font-size: 0.8125rem; }

const TAU = Math.PI * 2;

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function canvasTexture(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function roundedRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Shown until (or instead of) a photo: warm gradient with the product name.
function placeholderTexture(name) {
  return canvasTexture(640, 800, (ctx, w, h) => {
    const g = ctx.createRadialGradient(w * 0.5, h * 0.62, 20, w * 0.5, h * 0.55, h * 0.75);
    g.addColorStop(0, '#d9963f'); g.addColorStop(0.55, '#7a3a12'); g.addColorStop(1, '#24170f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#f2ede3';
    ctx.font = '52px Gloock, Georgia, serif';
    ctx.textAlign = 'center';
    const words = name.split(' ');
    const lines = [];
    let line = '';
    for (const wd of words) { const tl = line ? `${line} ${wd}` : wd; if (ctx.measureText(tl).width > w * 0.8) { lines.push(line); line = wd; } else line = tl; }
    lines.push(line);
    lines.forEach((l, i) => ctx.fillText(l, w / 2, h - 90 - (lines.length - 1 - i) * 60));
  });
}

// Crop a photo texture to the card's aspect ratio, like CSS object-fit: cover.
function coverCrop(tex, cardAspect, [fx, fy] = [0.5, 0.5]) {
  const img = tex.image;
  const a = img.width / img.height;
  tex.repeat.set(1, 1); tex.offset.set(0, 0);
  if (a > cardAspect) { tex.repeat.x = cardAspect / a; tex.offset.x = (1 - tex.repeat.x) * fx; }
  else { tex.repeat.y = a / cardAspect; tex.offset.y = (1 - tex.repeat.y) * (1 - fy); }
  tex.needsUpdate = true;
}

function makeCarousel(host, items, { onFront, onOpen, reduced }) {
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) {
    return null;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  host.appendChild(renderer.domElement);
  const canvas = renderer.domElement;
  canvas.className = 'carousel-canvas';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);
  const N = items.length, STEP = TAU / N;
  const R = Math.max(3.1, (N * 1.75) / TAU);
  const W = 1.5, H = 1.875, ASPECT = W / H;
  const ring = new THREE.Group();
  scene.add(ring);

  const mask = canvasTexture(256, 320, (ctx, w, h) => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff'; roundedRectPath(ctx, 1, 1, w - 2, h - 2, 22); ctx.fill();
  }, false);
  const fadeMask = canvasTexture(256, 320, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, h, 0, 0);
    g.addColorStop(0, '#fff'); g.addColorStop(0.45, '#000'); g.addColorStop(1, '#000');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    roundedRectPath(ctx, 1, 1, w - 2, h - 2, 22); ctx.save(); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); ctx.restore();
  }, false);

  // Card geometry bent onto the ring
  const geo = new THREE.PlaneGeometry(W, H, 24, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), a = x / R;
    p.setXYZ(i, Math.sin(a) * R, y + H / 2 + 0.04, Math.cos(a) * R);
  }
  geo.computeVertexNormals();

  const loader = new THREE.TextureLoader();
  const cards = items.map((item, i) => {
    const holder = new THREE.Group();
    holder.rotation.y = i * STEP;
    const mat = new THREE.MeshBasicMaterial({ map: placeholderTexture(item.name), alphaMap: mask, transparent: true, alphaTest: 0.02 });
    const refl = new THREE.MeshBasicMaterial({ map: mat.map, alphaMap: fadeMask, transparent: true, opacity: 0.3, depthWrite: false });
    const card = new THREE.Mesh(geo, mat);
    const mirror = new THREE.Mesh(geo, refl);
    mirror.scale.y = -1;
    holder.add(card, mirror);
    ring.add(holder);
    card.userData.index = i;
    return { card, mat, refl };
  });

  function setPhoto(i, src, focus) {
    const { mat, refl } = cards[i];
    loader.load(src, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      coverCrop(tex, ASPECT, focus);
      mat.map.dispose();
      mat.map = tex; refl.map = tex;
      mat.needsUpdate = true; refl.needsUpdate = true;
    });
  }
  items.forEach((item, i) => { if (item.src) setPhoto(i, item.src, item.focus); });

  // Warm pool of light on the counter under the front photo
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(6, 3).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({
      map: canvasTexture(256, 128, (ctx, w, h) => {
        const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        g.addColorStop(0, 'rgba(233,164,64,0.55)'); g.addColorStop(1, 'rgba(233,164,64,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      }),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }),
  );
  glow.position.set(0, 0.001, R);
  scene.add(glow);

  // Flour drifting in the light
  const FN = 220, fpos = new Float32Array(FN * 3), fspeed = new Float32Array(FN), fphase = new Float32Array(FN);
  const r = rng(6);
  for (let i = 0; i < FN; i++) {
    fpos[i * 3] = (r() * 2 - 1) * 3.4; fpos[i * 3 + 1] = r() * 2.6; fpos[i * 3 + 2] = R - 1.4 + r() * 2.8;
    fspeed[i] = 0.03 + r() * 0.07; fphase[i] = r() * TAU;
  }
  const fgeo = new THREE.BufferGeometry();
  fgeo.setAttribute('position', new THREE.BufferAttribute(fpos, 3));
  const flour = new THREE.Points(fgeo, new THREE.PointsMaterial({
    map: canvasTexture(64, 64, (ctx, w) => {
      const g = ctx.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      g.addColorStop(0, 'rgba(255,248,236,1)'); g.addColorStop(0.4, 'rgba(255,248,236,0.5)'); g.addColorStop(1, 'rgba(255,248,236,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, w);
    }),
    size: 0.035, transparent: true, opacity: 0.55, depthWrite: false,
  }));
  flour.frustumCulled = false;
  scene.add(flour);

  // State
  let angle = 0, target = 0, velocity = 0, dragging = false, moved = 0, lastX = 0, lastT = 0;
  let front = -1, visible = true, hovering = false, autoTimer = 0, last = performance.now();
  const ndc = new THREE.Vector2(), ray = new THREE.Raycaster();
  const frontIndex = () => (((Math.round(-target / STEP) % N) + N) % N);

  function resize() {
    const { width, height } = host.getBoundingClientRect();
    if (!width || !height) return;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    // Narrow screens: come closer so the front photo fills the frame.
    const dist = camera.aspect < 0.9 ? 4.1 / Math.max(camera.aspect, 0.6) : 4.6;
    camera.position.set(0, 0.95, R + dist);
    camera.lookAt(0, 0.82, R - 0.4);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  function goTo(i) {
    const cur = frontIndex();
    let d = ((i - cur) % N + N) % N;
    if (d > N / 2) d -= N;
    target -= d * STEP;
  }

  function pick(e) {
    const rect = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(cards.map((c) => c.card))[0];
    return hit ? hit.object.userData.index : -1;
  }

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; moved = 0; lastX = e.clientX; lastT = performance.now(); velocity = 0;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('is-dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) {
      if (e.pointerType === 'mouse') canvas.style.cursor = pick(e) >= 0 ? 'pointer' : 'grab';
      return;
    }
    const now = performance.now(), dx = e.clientX - lastX;
    moved += Math.abs(dx);
    const da = (dx / canvas.clientWidth) * 2.2;
    angle += da; target = angle;
    velocity = da / Math.max(1, now - lastT) * 16;
    lastX = e.clientX; lastT = now;
  });
  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('is-dragging');
    if (moved < 6) {
      const i = pick(e);
      if (i >= 0) { if (i === frontIndex()) onOpen(i); else goTo(i); }
      return;
    }
    target = Math.round((angle + velocity * 10) / STEP) * STEP;
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  host.addEventListener('pointerenter', () => { hovering = true; });
  host.addEventListener('pointerleave', () => { hovering = false; });
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; }).observe(host);

  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!visible || document.hidden) return;
    if (!reduced && !dragging && !hovering) {
      autoTimer += dt;
      if (autoTimer > 4.2) { autoTimer = 0; target -= STEP; }
    } else if (dragging || hovering) autoTimer = 0;
    if (!dragging) {
      const k = reduced ? 1 : Math.min(1, dt * 4.5);
      angle += (target - angle) * k;
    }
    ring.rotation.y = angle;
    for (let i = 0; i < N; i++) {
      const facing = Math.cos(i * STEP + angle);
      const lit = 0.18 + 0.82 * Math.pow(Math.max(0, facing), 2.2);
      cards[i].mat.color.setScalar(lit);
      cards[i].refl.opacity = 0.32 * lit;
    }
    if (!reduced) {
      for (let i = 0; i < FN; i++) {
        fpos[i * 3 + 1] += fspeed[i] * dt;
        fpos[i * 3] += Math.sin(now * 0.0004 + fphase[i]) * 0.0012;
        if (fpos[i * 3 + 1] > 2.6) fpos[i * 3 + 1] = 0;
      }
      fgeo.attributes.position.needsUpdate = true;
    }
    const f = frontIndex();
    if (f !== front) { front = f; onFront(f); }
    renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);

  return {
    goTo,
    setPhoto,
    next: () => { target -= STEP; autoTimer = 0; },
    prev: () => { target += STEP; autoTimer = 0; },
    setNames(names) {
      // Re-draw placeholders (for cards whose photo hasn't loaded) in the new language.
      cards.forEach((c, i) => {
        if (c.mat.map && c.mat.map.isCanvasTexture) {
          c.mat.map.dispose();
          c.mat.map = c.refl.map = placeholderTexture(names[i]);
          c.mat.needsUpdate = c.refl.needsUpdate = true;
        }
      });
    },
  };
}

  try {
    const q = new URLSearchParams(location.search).get('lang');

    const s = localStorage.getItem('do-lang');
    if (s === 'en' || s === 'fr') return s;

  return 'fr';
})();

// Keep numbers and their units together on one line.
function nb(s) {
  return String(s)
    .replace(/(\d) (?=(?:g|ml|kg|cm|mm|min|h|°C|%)(?!\p{L}))/gu, '$1 ')
    .replace(/(\bh) (\d)/g, '$1 $2')
    .replace(/(\d) × (\d)/g, '$1 × $2');
}

function localize(p) {
  if (lang === 'en') return { ...p, sub: p.en };
  const f = PRODUCTS_FR[p.id] || {};
  const components = p.components.map((c, i) => {
    const fc = f.components?.[i];
    return {
      ...c,
      title: fc?.title ?? c.title,
      note: fc ? fc.note : c.note,
      items: c.items.map((it, j) => {
        const fi = fc?.items?.[j];
        if (fi == null) return it;
        return typeof fi === 'string' ? { ...it, n: fi, note: undefined } : { ...it, n: fi.n, note: fi.note };
      }),
    };
  });
  return {
    ...p,
    sub: f.en ?? null,
    short: f.short ?? p.short,
    definition: f.definition ?? p.definition,
    origin: f.origin ?? p.origin,
    taste: f.taste ?? p.taste,
    yield: { ...p.yield, ...f.yield },
    times: f.times ?? p.times,
    level: LEVELS_FR[p.level] ?? p.level,
    allergens: p.allergens.map((a) => ALLERGENS_FR[a] ?? a),
    components,
    steps: f.steps ?? p.steps,
    tip: f.tip ?? p.tip,
  };
}

// Tilt an element towards the pointer, with a moving highlight.
function bindTilt(zone, el, max) {
  let pressed = false;
  const move = (e) => {
    if (e.pointerType === 'touch' && !pressed) return;
    const r = el.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    el.style.setProperty('--ry', `${(x - 0.5) * 2 * max}deg`);
    el.style.setProperty('--rx', `${(0.5 - y) * 2 * max * 0.8}deg`);
    el.style.setProperty('--gx', `${x * 100}%`);
    el.style.setProperty('--gy', `${y * 100}%`);
    el.style.setProperty('--mx', (x - 0.5) * 2);
    el.style.setProperty('--my', (y - 0.5) * 2);
    el.classList.add('is-tilting');
  };
  const reset = () => {
    pressed = false;
    el.classList.remove('is-tilting');
    el.style.setProperty('--rx', '0deg');
    el.style.setProperty('--ry', '0deg');
    el.style.setProperty('--mx', 0);
    el.style.setProperty('--my', 0);
  };
  zone.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') { pressed = true; move(e); } });
  zone.addEventListener('pointermove', move);
  zone.addEventListener('pointerleave', reset);
  zone.addEventListener('pointerup', (e) => { if (e.pointerType === 'touch') reset(); });
  zone.addEventListener('pointercancel', reset);
}

function paintShelves() {

}

function injectStructuredData() {

// ───────── Photos from Wikimedia Commons (or local files)
const stripHtml = (html) => {
  const text = new DOMParser().parseFromString(html || '', 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
  return text.length > 80 ? `${text.slice(0, 77)}…` : text;
};

async function loadPhotos() {
  const wanted = [];
  for (const [id, entry] of Object.entries(PHOTOS)) {
    if (entry.local) PHOTO[id] = { small: entry.local, large: entry.local, credit: entry.credit ?? null };
    else if (entry.commons) wanted.push(...entry.commons.map((f) => `File:${f}`));
  }
  if (!wanted.length) return;
  const query = (width) => fetch('https://commons.wikimedia.org/w/api.php?' + new URLSearchParams({
    action: 'query', format: 'json', formatversion: '2', origin: '*',
    prop: 'imageinfo', iiprop: 'url|extmetadata', iiextmetadatafilter: 'Artist|LicenseShortName',
    iiurlwidth: String(width), titles: [...new Set(wanted)].join('|'),
  })).then((r) => r.json());
  let small, large;
  try {
    [small, large] = await Promise.all([query(960), query(1280)]);
  } catch (e) {
    return; // offline or blocked: the named placeholders stay
  }
  const index = (res) => {
    const pages = new Map((res.query?.pages || []).map((pg) => [pg.title, pg]));
    for (const n of res.query?.normalized || []) if (pages.has(n.to)) pages.set(n.from, pages.get(n.to));
    return pages;
  };
  const S = index(small), L = index(large);
  for (const [id, entry] of Object.entries(PHOTOS)) {
    if (!entry.commons) continue;
    for (const f of entry.commons) {
      const ps = S.get(`File:${f}`), pl = L.get(`File:${f}`);
      const is = ps?.imageinfo?.[0], il = pl?.imageinfo?.[0];
      if (!is || ps.missing) continue;
      const meta = is.extmetadata || {};
      PHOTO[id] = {
        small: is.thumburl || is.url,
        large: il?.thumburl || il?.url || is.thumburl || is.url,
        credit: { author: stripHtml(meta.Artist?.value) || 'Wikimedia Commons', license: meta.LicenseShortName?.value || '', url: is.descriptionurl },
      };
      break;
    }
  }
}

// Put the loaded photos into the menu, the 3D ring and the open product page.
function applyPhotos() {
  document.querySelectorAll('.item').forEach((item) => {
    const id = item.dataset.id, src = photoSrc(id, 800);
    const box = item.querySelector('.item-photo');
    if (!src || box.querySelector('img')) return;
    const img = new Image();
    img.alt = photoAlt(id);
    img.decoding = 'async';
    img.loading = 'lazy';
    img.width = 800; img.height = 1000;
    img.addEventListener('load', () => box.classList.remove('is-empty'));
    img.addEventListener('error', () => img.remove());
    img.src = src;
    box.prepend(img);
  });
  if (carousel) PRODUCTS.forEach((p, i) => { const src = photoSrc(p.id, 800); if (src) carousel.setPhoto(i, src); });
  updateHeroCaption();
  renderCredits();
  if (D.open) setStagePhoto(D.id);
}

// ───────── Home page 3D photo ring
let carousel = null, heroFront = 0;
function updateHeroCaption() {
  const p = PRODUCTS[heroFront];
  byId('heroName').textContent = p.name;
  const fb = byId('heroFallback');
  if (fb) { fb.src = photoSrc(p.id, 800) || ''; fb.alt = photoAlt(p.id); }
}
function heroOpenRect() {
  // The front photo sits in the middle of the ring's frame.
  const r = byId('heroView').getBoundingClientRect();
  const h = r.height * 0.6, w = h * 0.8;
  return { left: r.left + (r.width - w) / 2, top: r.top + r.height * 0.14, width: w, height: h };
}
function initHero() {
  const host = byId('heroView');
  carousel = makeCarousel(host, PRODUCTS.map((p) => ({ name: p.name, src: photoSrc(p.id, 800) })), {
    reduced: REDUCED,
    onFront: (i) => { heroFront = i; updateHeroCaption(); },
    onOpen: (i) => openDetail(PRODUCTS[i].id, { fromRect: heroOpenRect(), returnFocus: byId('heroOpen') }),
  });
  if (!carousel) {
    // No WebGL: a plain photo that changes with the arrows.
    host.innerHTML = '<img id="heroFallback" class="hero-fallback" alt="">';
    updateHeroCaption();
  }
  const go = (d) => {
    if (carousel) { if (d > 0) carousel.next(); else carousel.prev(); }
    else { heroFront = (heroFront + d + PRODUCTS.length) % PRODUCTS.length; updateHeroCaption(); }
  };
  byId('heroPrev').addEventListener('click', () => go(-1));
  byId('heroNext').addEventListener('click', () => go(1));
  byId('heroOpen').addEventListener('click', () => openDetail(PRODUCTS[heroFront].id, { fromRect: heroOpenRect(), returnFocus: byId('heroOpen') }));
}

function setStagePhoto(id) {

    img.alt = photoAlt(id);

    img.removeAttribute('src');

  const c = PHOTO[id]?.credit;
  byId('photoCredit').innerHTML = c ? `${esc(t('photoBy'))} : <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(creditText(c))}</a>` : '';
}
byId('photoImg').addEventListener('error', () => { photoCard.classList.add('is-empty'); byId('photoImg').hidden = true; });

// Quantities
const fmtNum = (v) => new Intl.NumberFormat(locale(), { maximumFractionDigits: 1 }).format(v);
function fmtQty(q, u, f) {
  if (q == null) return '';
  let v = q * f;
  if (u === 'g' || u === 'ml') {
    v = v >= 100 ? Math.round(v / 5) * 5 : v >= 10 ? Math.round(v) : Math.round(v * 2) / 2;
    return `${fmtNum(v)} ${u}`;
  }
  const r = Math.max(0.5, Math.round(v * 2) / 2);
  const whole = Math.floor(r), half = r - whole >= 0.5;
  return `${whole || ''}${half ? '½' : ''}`;
}
const scaleNote = (note, f) => (f === 1 || !note ? note : note.replace(/(\d+(?:[.,]\d+)?)\s?g\b/g, (m, n) => fmtQty(parseFloat(n.replace(',', '.')), 'g', f)));
const yieldStep = (n) => (n >= 4 ? n / 2 : 1);

function renderIngredients(p) {
  const base = PRODUCT[p.id].yield.n;
  const f = D.count / base;
  const unit = D.count === 1 ? p.yield.unit1 : p.yield.unit;
  const step = yieldStep(base);
  const html = [];
  html.push(`<div class="ing-head"><h3>${esc(t('ingredients'))}</h3>
    <div class="scaler" role="group" aria-label="${esc(t('makes'))}">
      <button type="button" data-scale="-1" aria-label="${esc(t('less'))}" ${D.count - step < step ? 'disabled' : ''}>−</button>
      <output aria-live="polite">${esc(t('makes'))} ${fmtNum(D.count)} ${esc(unit)}</output>
      <button type="button" data-scale="1" aria-label="${esc(t('more'))}" ${D.count + step > base * 4 ? 'disabled' : ''}>+</button>
    </div></div>`);
  if (f === 1 && p.yield.size) {
    html.push(`<p class="component-note">${esc(nb(p.yield.size.charAt(0).toUpperCase() + p.yield.size.slice(1)))}.</p>`);
  } else if (f !== 1) {
    const orig = `${fmtNum(base)} ${base === 1 ? p.yield.unit1 : p.yield.unit}${p.yield.size ? `, ${p.yield.size}` : ''}`;
    html.push(`<p class="scale-note">${lang === 'fr'
      ? `Quantités multipliées par ${fmtNum(f)}. Les tailles et le nombre de pièces indiqués dans la méthode correspondent à la recette d’origine : ${esc(nb(orig))}.`
      : `Quantities multiplied by ${fmtNum(f)}. Sizes and piece counts in the method are for the original recipe: ${esc(nb(orig))}.`}</p>`);
  }
  p.components.forEach((c, ci) => {
    html.push(`<div class="component"><h4>${esc(c.title)}</h4><ul>`);
    c.items.forEach((it, ii) => {
      const key = `${ci}-${ii}`;
      const note = scaleNote(it.note, f);
      html.push(`<li><label><input type="checkbox" data-key="${key}" ${D.checked.has(key) ? 'checked' : ''}>
        <span class="qty">${esc(fmtQty(it.q, it.u, f))}</span>
        <span class="ing-name">${esc(nb(it.n))}${note ? `<span class="ing-note">${esc(nb(note))}</span>` : ''}</span></label></li>`);
    });
    html.push('</ul>');
    if (c.note) html.push(`<p class="component-note">${esc(nb(c.note))}</p>`);
    html.push('</div>');
  });
  return html.join('');
}

function renderPaper(id, keepState = false) {
  const p = localize(PRODUCT[id]);
  const cat = CATEGORIES.find((c) => c.id === p.category);
  if (!keepState) { D.count = PRODUCT[id].yield.n; D.checked = new Set(); }
  paper.innerHTML = `<div class="paper-inner">
    <header class="paper-head">
      <p class="paper-cat">${esc(cat.name)}</p>
      <h2 id="detailTitle">${esc(p.name)}</h2>
      <p class="paper-ipa" aria-hidden="true">${esc(p.ipa)}</p>
      ${p.sub ? `<p class="paper-sub">${esc(p.sub)}</p>` : ''}
    </header>
    <section class="paper-block"><h3>${esc(t('whatIs'))}</h3><p class="paper-lede">${esc(nb(p.definition))}</p></section>
    <section class="paper-block"><h3>${esc(t('origin'))}</h3><p>${esc(nb(p.origin))}</p></section>
    <section class="paper-block"><h3>${esc(t('taste'))}</h3><p>${esc(nb(p.taste))}</p></section>
    <dl class="facts">
      <div><dt>${esc(t('prep'))}</dt><dd>${esc(nb(p.times.prep))}</dd></div>
      <div><dt>${esc(t('rest'))}</dt><dd>${esc(nb(p.times.rest))}</dd></div>
      <div><dt>${esc(t('bake'))}</dt><dd>${esc(nb(p.times.bake))}</dd></div>
      <div><dt>${esc(t('level'))}</dt><dd>${esc(p.level)}</dd></div>
    </dl>
    <p class="allergens"><span>${esc(t('allergens'))}</span>${p.allergens.map((a) => `<span class="chip">${esc(a)}</span>`).join('')}</p>
    <section class="ingredients" id="ingredients">${renderIngredients(p)}</section>
    <section class="method"><h3>${esc(t('method'))}</h3><ol>${p.steps.map((s) => `<li><span>${esc(nb(s))}</span></li>`).join('')}</ol></section>
    <aside class="tip"><h3>${esc(t('tip'))}</h3><p>${esc(nb(p.tip))}</p></aside>
    <p class="recipe-note">${esc(t('recipeNote'))}</p>
    <div class="paper-actions"><button class="btn btn-ink" type="button" id="btnPrint">${esc(t('print'))}</button></div>
  </div>`;
  byId('btnPrint').addEventListener('click', () => window.print());
}

paper.addEventListener('click', (e) => {
  const b = e.target.closest('[data-scale]');
  if (!b || !D.id) return;
  const base = PRODUCT[D.id].yield.n, step = yieldStep(base);
  D.count = Math.min(base * 4, Math.max(step, D.count + step * Number(b.dataset.scale)));
  byId('ingredients').innerHTML = renderIngredients(localize(PRODUCT[D.id]));
  byId('ingredients').querySelector(`[data-scale="${b.dataset.scale}"]`)?.focus();
});
paper.addEventListener('change', (e) => {
  const k = e.target.dataset?.key;
  if (!k) return;
  if (e.target.checked) D.checked.add(k); else D.checked.delete(k);
});

function setInert(on) {
  for (const el of [byId('top'), byId('nav'), byId('footer'), document.querySelector('.skip')]) el.inert = on;
}

const idFromHash = () => { const m = location.hash.match(/^#\/([\w-]+)$/); return m && PRODUCT[m[1]] ? m[1] : null; };

// The photo flies from where it was tapped into the product page, turning in 3D.
function flyIn(from) {
  if (REDUCED || !from) return;
  const last = photoCard.getBoundingClientRect();
  if (!last.width) return;
  const dx = from.left + from.width / 2 - (last.left + last.width / 2);
  const dy = from.top + from.height / 2 - (last.top + last.height / 2);
  const sx = from.width / last.width, sy = from.height / last.height;
  photoCard.animate([
    { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` },
    { transform: `translate(${dx * 0.35}px, ${dy * 0.35}px) scale(${(sx + 1) / 2}, ${(sy + 1) / 2}) rotateY(-16deg) rotateX(7deg)`, offset: 0.55 },
    { transform: 'none' },
  ], { duration: 850, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

async function flipPhoto(id) {
  if (!REDUCED) await photoCard.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }], { duration: 200, easing: 'ease-in' }).finished.catch(() => {});
  setStagePhoto(id);
  if (!REDUCED) photoCard.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

function openDetail(id, { fromEl = null, fromRect = null, returnFocus = null, push = true, replace = false, flip = false } = {}) {
  if (!PRODUCT[id]) return;
  const firstOpen = !D.open;
  D.id = id;
  renderPaper(id);
  paper.scrollTop = 0;
  dlg.scrollTop = 0;
  if (push) { history.pushState({ detail: id }, '', `#/${id}`); D.pushed = true; }
  else if (replace) history.replaceState(history.state?.detail ? history.state : null, '', `#/${id}`);
  if (firstOpen) {
    setStagePhoto(id);
    D.returnFocus = returnFocus || document.activeElement;
    D.open = true;
    dlg.hidden = false;
    setInert(true);
    document.documentElement.style.overflow = 'hidden';
    if (!REDUCED) {
      dlg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });
      paper.animate([{ transform: 'translateY(24px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 520, delay: 160, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
    }
    flyIn(fromRect || fromEl?.getBoundingClientRect());
    paper.focus({ preventScroll: true });
  } else if (flip) {
    flipPhoto(id);
  } else {
    setStagePhoto(id);
  }
  updateStageLabels();
}

function updateStageLabels() {
  byId('btnPrev').setAttribute('aria-label', t('prev'));
  byId('btnNext').setAttribute('aria-label', t('next'));
  byId('btnClose').setAttribute('aria-label', t('close'));
}

async function closeDetail({ fromPop = false } = {}) {
  if (!D.open) return;
  D.open = false;
  if (!REDUCED) await dlg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: 'ease-in' }).finished.catch(() => {});
  dlg.hidden = true;
  setInert(false);
  document.documentElement.style.overflow = '';
  if (!fromPop) {
    if (D.pushed) history.back();
    else history.replaceState(null, '', location.pathname + location.search);
  }
  D.pushed = false;
  D.returnFocus?.focus?.({ preventScroll: true });
}

function step(dir) {
  const i = PRODUCTS.findIndex((p) => p.id === D.id);
  const next = PRODUCTS[(i + dir + PRODUCTS.length) % PRODUCTS.length].id;
  openDetail(next, { push: false, replace: true, flip: true });
}

byId('btnClose').addEventListener('click', () => closeDetail());
byId('btnPrev').addEventListener('click', () => step(-1));
byId('btnNext').addEventListener('click', () => step(1));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && D.open) closeDetail(); });
addEventListener('popstate', () => {
  const id = idFromHash();
  if (id) { D.pushed = false; openDetail(id, { push: false }); } else closeDetail({ fromPop: true });
});
if (!REDUCED) bindTilt(stage, photoCard, 10);

byId('lang').addEventListener('click', () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('do-lang', lang); } catch (e) { /* ignore */ }
  applyLang();
});

// ───────── Start
renderShelves();
applyLang();
injectStructuredData();
initHero();
loadPhotos().then(applyPhotos);

const nav = byId('nav');
const onScroll = () => nav.classList.toggle('is-solid', scrollY > 40);
addEventListener('scroll', onScroll, { passive: true });
onScroll();

const startId = idFromHash();
if (startId) openDetail(startId, { push: false });

</script>
</body>
</html>
