name: Bakery photos

# Downloads the Wikimedia Commons photos listed in boulangerie/src/data.js,
# crops them to 4:5 WebP in boulangerie/images/, rebuilds the site and
# commits the result back to the branch.
on:
  push:
    paths:
      - 'boulangerie/src/data.js'
      - 'boulangerie/tools/fetch_photos.py'
      - '.github/workflows/bakery-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bakery-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download and crop photos
        run: python3 boulangerie/tools/fetch_photos.py
      - name: Rebuild the site
        run: python3 boulangerie/build.py
      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boulangerie/images boulangerie/src/photos.generated.js boulangerie/index.html
          if git diff --cached --quiet; then
            echo "Photos already up to date."
          else
            git commit -m "Update bakery photos from Wikimedia Commons"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
